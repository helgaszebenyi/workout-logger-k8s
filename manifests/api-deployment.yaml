# Runs the Express API from project 1 and keeps it running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: workout-logger
  labels:
    app: api
spec:
  replicas: 1                     # how many copies (pods) to keep running
  selector:
    matchLabels:
      app: api                    # "the pods with this label are mine"
  template:                       # the blueprint for each pod
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # The immutable tag CI published for one exact commit.
          image: ghcr.io/helgaszebenyi/workout-logger-api:sha-2d4f7f0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/service-account.json
          volumeMounts:
            # The Secret appears as a file: /secrets/service-account.json
            - name: firebase-key
              mountPath: /secrets
              readOnly: true
          # Liveness: "is the process alive?" If it fails, Kubernetes restarts the container.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          # Readiness: "can it serve traffic?" (checks Firestore). If it fails,
          # the pod gets no traffic, but isn't restarted.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: firebase-key
          secret:
            secretName: firebase-service-account